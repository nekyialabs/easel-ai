name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: typecheck (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No build/test scripts exist; `tsc --noEmit` is the check. npm ci also
      # exercises the native better-sqlite3 install on windows-latest.
      - name: Typecheck
        run: npm run typecheck
